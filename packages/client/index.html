<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎣 勾肥大戰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a2a1a; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #game-container { position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    canvas { display: block; }

    #lobby { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(20,30,20,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; gap: 12px; }
    #lobby.hidden { display: none; }
    #lobby h1 { font-size: 42px; color: #ffd93d; text-shadow: 2px 2px 0 #553311; margin-bottom: 8px; }
    #lobby h2 { font-size: 16px; color: #88aa88; margin-bottom: 16px; }
    #lobby input { font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 2px solid #446644; outline: none; width: 260px; text-align: center; background: #fff; }
    #lobby button { font-size: 16px; padding: 12px 24px; border-radius: 8px; border: 2px solid #aa8833; background: #ffd93d; color: #3a2a00; font-weight: 700; cursor: pointer; width: 260px; }
    #lobby button:hover { background: #ffe566; }
    #lobby button:active { transform: scale(0.98); }
    #lobby .btn-secondary { background: #88bb66; border-color: #668844; color: #1a3a00; }
    #lobby .divider { color: #557755; font-size: 13px; }
    #lobby .error { color: #ff6b6b; font-size: 13px; min-height: 18px; }

    #waiting { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(20,30,20,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; gap: 10px; }
    #waiting.visible { display: flex; }
    #waiting h2 { color: #ffd93d; font-size: 24px; }
    .room-code { font-size: 32px; font-weight: 900; color: #ffd93d; letter-spacing: 6px; background: rgba(0,0,0,0.3); padding: 6px 20px; border-radius: 8px; }
    .player-list { display: flex; gap: 24px; margin: 12px 0; }
    .team-col { text-align: center; min-width: 140px; }
    .team-col h3 { font-size: 15px; margin-bottom: 6px; padding: 3px 12px; border-radius: 6px; }
    .team-left h3 { background: #4488cc; color: #fff; }
    .team-right h3 { background: #cc4444; color: #fff; }
    .player-name { color: #fff; font-size: 14px; padding: 2px 0; }
    #waiting .info { color: #88aa88; font-size: 14px; }
    #waiting button { font-size: 18px; padding: 10px 40px; border-radius: 8px; border: 2px solid #aa8833; background: #ffd93d; color: #3a2a00; font-weight: 700; cursor: pointer; margin-top: 8px; }

    #kill-feed { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
    .kill-entry { background: rgba(0,0,0,0.6); color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 12px; transition: opacity 0.5s; white-space: nowrap; }

    #game-over { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; gap: 12px; }
    #game-over.visible { display: flex; }
    #game-over h1 { font-size: 42px; color: #ffd93d; }
    #game-over .score { font-size: 22px; color: #fff; }
    #game-over button { font-size: 18px; padding: 10px 40px; border-radius: 8px; border: 2px solid #aa8833; background: #ffd93d; color: #3a2a00; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="lobby">
      <h1>🎣 勾肥大戰</h1>
      <h2>Pudge Wars Online</h2>
      <input id="nickname" type="text" placeholder="輸入暱稱..." maxlength="12" />
      <button id="btn-create">建立房間</button>
      <div class="divider">── 或 ──</div>
      <input id="room-code-input" type="text" placeholder="輸入房間代碼" maxlength="4" style="text-transform:uppercase" />
      <button id="btn-join" class="btn-secondary">加入房間</button>
      <div class="error" id="error-msg"></div>
    </div>

    <div id="waiting">
      <h2>等待玩家加入...</h2>
      <div class="info">房間代碼</div>
      <div class="room-code" id="display-room-code">----</div>
      <div class="player-list">
        <div class="team-col team-left"><h3>藍隊</h3><div id="team-left-players"></div></div>
        <div class="team-col team-right"><h3>紅隊</h3><div id="team-right-players"></div></div>
      </div>
      <div class="info" id="waiting-info">至少需要 2 位玩家</div>
      <button id="btn-start">開始遊戲！</button>
    </div>

    <div id="kill-feed"></div>

    <div id="game-over">
      <h1 id="winner-text"></h1>
      <div class="score" id="final-score"></div>
      <button id="btn-restart">再來一局！</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
